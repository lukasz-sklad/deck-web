<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>DeckCraft — Prezentacje</title>
  
<script type="module">
import init, * as bindings from './deckcraft-web-9cc2834dfd28cf0.js';
const wasm = await init({ module_or_path: './deckcraft-web-9cc2834dfd28cf0_bg.wasm' });


window.wasmBindings = bindings;
window.deckcraft_command = bindings.deckcraft_command;

dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <link rel="icon" href="./ai.storyteller.deckcraft-74e97653dd8dd002.png" integrity="sha384&#x2D;THDce39ERZRgdnEtM&#x2F;35FnmU4IExPfz9k2XrApCGWP0NUMC98NUWG1VYUMNXNCiD"/>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #deckcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #deckcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./deckcraft-web-9cc2834dfd28cf0.js" crossorigin="anonymous" integrity="sha384-VPdfpiEHtYTFOD5RauZeJrLx2lB+6o/zcRqL8RFYaiI4C75X1JGXMqUo/3Ahata1"><link rel="preload" href="./deckcraft-web-9cc2834dfd28cf0_bg.wasm" crossorigin="anonymous" integrity="sha384-aGJmTQtBL3/UC9INzVhJxERaidYUqRiQut5W6b2p/TFIAQ0Nh34p9JoLJ4QtsJ5e" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="deckcraft_canvas"></canvas>
  <div id="deckcraft_loading">Ładowanie DeckCraft&hellip;</div>
  <script>
    function setDeckTheme(targetTheme) {
      const isLight = targetTheme === "light";
      const fn = window.deckcraft_command || (window.wasmBindings && window.wasmBindings.deckcraft_command);
      if (typeof fn === "function") {
        try {
          fn("view.dark", JSON.stringify({ on: !isLight }));
        } catch (err) {
          console.warn("[DeckCraft] Błąd zmiany motywu:", err);
        }
      } else {
        window.__pending_theme = targetTheme;
      }
    }

    window.addEventListener("message", (event) => {
      if (!event.data) return;
      const theme = event.data.theme || (event.data.type === "set_theme" ? event.data.value : null);
      if (theme === "light" || theme === "dark") {
        setDeckTheme(theme);
      }
    });

    if (new URLSearchParams(window.location.search).get("theme") === "light") {
      try {
        document.documentElement.style.colorScheme = "light";
        document.body.style.background = "#f5f5f5";
        const loading = document.getElementById("deckcraft_loading");
        if (loading) {
          loading.style.color = "#444";
        }
      } catch (_) {}
    }

    window.addEventListener("TrunkApplicationStarted", () => {
      if (window.wasmBindings && window.wasmBindings.deckcraft_command) {
        window.deckcraft_command = window.wasmBindings.deckcraft_command;
      }
      const params = new URLSearchParams(window.location.search);
      const initial = window.__pending_theme || (params.get("theme") === "light" ? "light" : null);
      if (initial) {
        setDeckTheme(initial);
      }
    });
  </script>
</body>
</html>
